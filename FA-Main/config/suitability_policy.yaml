# Suitability rule engine (slide 27). Thresholds are illustrative defaults held in
# configuration; calibrate them against UBS suitability policy before any pilot.
#
# Outcomes: BLOCK stops the workflow, FAIL blocks the idea (it is regenerated and can
# never reach the memo), FLAG needs a documented advisor decision, PASS proceeds.

rules:
  R1_mandatory_fields:
    # Missing objective, horizon, risk profile, liquidity need or investable amount -> BLOCK
    fields: [goals, time_horizon_months, stated_risk_willingness, liquidity_schedule, total_wealth]

  R2_approved_universe: {}            # instrument not in data/universe/approved_products.json -> FAIL

  R3_allocations_sum:
    tolerance_pp: 0.01                # post-trade weights must sum to 100% +/- 0.01 pt -> else FAIL

  R4_risk_band: {}                    # proposed risk score above the client's band -> FAIL

  R5_willingness_vs_capacity: {}      # any gap -> FLAG, lower band applied

  R6_short_horizon_growth:
    max_horizon_months: 36            # goals of 3 years or less
    max_growth_pct: 30.0
    growth_asset_classes: [Equities, Real Estate, Commodities]

  R7_concentration:
    limit_pct: 30.0                   # single market, sector or instrument share after the change
    diversified_regions: [Global]     # not counted as a single market
    diversified_sectors: [Diversified]

  R8_evidence_freshness:
    max_age_days: 30                  # missing source -> FAIL, stale source -> FLAG

  R9_prohibited_wording:
    # Matches are ignored when negated ("not guaranteed", "cannot be guaranteed", "no guarantee").
    patterns: ['\bguarantee[sd]?\b', '\brisk[- ]free\b', '\bno risk\b', '\bcannot lose\b']

  R10_max_regenerations_per_idea: 2   # then escalate to the advisor

  L1_liquidity_coverage:              # slide 19: liquidity violation -> flag/fail
    window_months: 24
    min_coverage_ratio: 1.0

# R4, R6, R7 and L1 compare the portfolio before and after the proposed trades:
# a breach that already existed and is not made worse is a FLAG; a new or worsened breach is a FAIL.
existing_breach_outcome: FLAG
worsened_breach_outcome: FAIL

# Client limits layer (deck slide 12): a rule layer that maps what UBS can offer each client BEFORE any
# briefing or idea is produced. A blocked product is never shown; a gap is listed, never guessed.
# Illustrative defaults: calibrate against UBS / MAS / SFC distribution rules before any pilot.
client_limits:
  required_regulatory_fields: [domicile, booking_centre, agreement_type, investor_classification]
  agreement_types_with_advice: [Advisory, Discretionary]      # Execution-only: no recommendations at all
  us_person_domiciles: [US]
  us_person_blocked_fund_domiciles: [Ireland, Luxembourg]     # non-US funds: US-person distribution / tax limits
  tax_form_for_us_domiciled_products: {us_person: W-9, other: W-8BEN}
  specified_product_min_complexity: 2                         # needs a valid CKA (Customer Knowledge Assessment)
  retail_max_complexity: 2
  expiring_soon_days: 60                                      # warn (gap) before a CKA / tax form lapses
  # Cross-border distribution (deck slide 26): which fund jurisdictions a booking centre may distribute, and which
  # asset classes it may offer. Applies to funds and cash instruments (single stocks are securities, not registered funds); asset classes
  # apply to everything. A booking centre with no entry cannot be assessed: a gap is listed, never guessed.
  cross_border_distribution_matrix:
    Singapore:   {fund_jurisdictions: [US, Ireland, Luxembourg, Singapore],
                  asset_classes: [Equities, Fixed Income, Commodities, Real Estate, Cash Equivalents]}
    Hong Kong:   {fund_jurisdictions: [Ireland, Luxembourg, Hong Kong],
                  asset_classes: [Equities, Fixed Income, Commodities, Real Estate, Cash Equivalents]}
    Switzerland: {fund_jurisdictions: [Ireland, Luxembourg, Switzerland],
                  asset_classes: [Equities, Fixed Income, Commodities, Real Estate, Cash Equivalents]}
    UK:          {fund_jurisdictions: [Ireland, Luxembourg, United Kingdom],
                  asset_classes: [Equities, Fixed Income, Commodities, Cash Equivalents]}
  restriction_rules:                                          # client-specific restrictions -> blocked areas
    no_single_stocks: {instrument_type: Single Stock}
    no_high_yield: {sub_asset_contains: high yield}
    no_commodities: {asset_class: Commodities}
  disclosures:
    all: Product risk disclosure
    specified_product: Specified investment product risk disclosure
    fx: Currency risk disclosure
    fixed_income: Interest-rate and credit risk disclosure

# UC1 looks back over the last 3 months of CIO research; UC2 ideas need current (R8) research.
uc1_research_window_days: 90

# UC1 briefing (deck slide 9): the CIO reference mix per risk band, used to point out where the portfolio sits
# against it. Illustrative weights in %; replace with the CIO office's published strategic asset allocation.
cio_reference_mix:
  source_id: SRC-UBS-CIO-2026-101
  min_gap_pp: 5.0                     # smaller gaps are not raised
  mixes:
    Conservative:      {Equities: 25, Fixed Income: 55, Cash Equivalents: 15, Commodities: 5}
    Moderate:          {Equities: 45, Fixed Income: 40, Cash Equivalents: 10, Commodities: 5}
    Balanced Growth:   {Equities: 60, Fixed Income: 30, Cash Equivalents: 5, Commodities: 5}
    Aggressive Growth: {Equities: 75, Fixed Income: 15, Cash Equivalents: 5, Commodities: 5}
    Speculative:       {Equities: 85, Fixed Income: 5, Cash Equivalents: 5, Commodities: 5}

# Client notes since the last review that the briefing flags for the RM to confirm (deck slide 9).
# Keyword match only: a flag asks a question, it never changes the profile.
client_note_signals:
  income: {label: Income change flagged, implication: Potential impact on future investable cash flow.,
           keywords: [salary, income, new role, new job, job change, bonus, redundan, promotion]}
  liquidity: {label: Cash need flagged, implication: May change near-term liquidity needs.,
              keywords: [wedding, tuition, medical, renovation, large purchase]}
  family: {label: Family change flagged, implication: May change goals or dependants.,
           keywords: [baby, married, divorce, dependant, dependent]}

# Deterministic market signal conflict detector (deck slide 29). Each source gets a quantitative sentiment score,
# (bullish - bearish keyword hits) / (total hits), in [-1, 1]. Sources are grouped by ticker, asset class (sector
# proxy) and macro theme; a group conflicts when it holds a bullish and a bearish reading whose scores diverge by at
# least the threshold and whose publication dates are within max_gap_days. Conflicts are flagged, never resolved.
market_signals:
  direction_threshold: 0.2            # score above +t is bullish, below -t is bearish (same as the sentiment tool)
  divergence_threshold: 0.6           # bullish score minus bearish score
  max_gap_days: 30
