[client]
toolbarMode = "viewer"  # hide developer controls (Deploy) in the advisor workspace

[theme]
primaryColor = "#c8102e"
# the page canvas is painted by the stylesheet; widgets and table cells read these, so they stay white
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#ffffff"
textColor = "#1a1a1a"
borderColor = "#e6e6e3"
baseRadius = "0.6rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"

[theme.sidebar]
backgroundColor = "#ffffff"

[browser]
gatherUsageStats = false
